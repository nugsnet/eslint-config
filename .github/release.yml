# Groups the auto-generated release notes, so the changelog part of the body in
# `.github/RELEASE_TEMPLATE.md` writes itself. GitHub fills it from merged pull
# requests, by LABEL — a `Feature:` title prefix does not reach this file, so a
# pull request needs its label to land in the right section.
#
# The repository has `bug`, `documentation`, `enhancement`, and `dependencies`
# today. `breaking`, `feature`, `fix`, `hotfix`, `security`, and
# `skip-changelog` have to be created before a pull request can carry them.
# Dependabot labels its pull requests `dependencies`.
#
# The sections a person still writes by hand: Rule changes, Verification,
# Migration Notes, Linked Issues.
changelog:
  exclude:
    labels:
      - skip-changelog

  categories:
    - title: Breaking changes
      labels:
        - breaking

    - title: Features
      labels:
        - feature
        - enhancement

    - title: Fixes
      labels:
        - fix
        - bug
        - hotfix

    - title: Security
      labels:
        - security

    - title: Documentation
      labels:
        - documentation

    - title: Dependencies
      labels:
        - dependencies

    - title: Other changes
      labels:
        - "*"
